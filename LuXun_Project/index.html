<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与鲁迅跨越时空的对话 - 作者：陈思羽</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="particles-container"></div>

<div class="mobile-header">
    <div class="author-seal mobile-seal">陈思羽</div>
    <span>跨越时空的对话</span>
</div>

<div class="sidebar">
    <div class="author-seal-container desktop-only">
        <div class="author-seal">陈思羽</div>
    </div>
    <div class="section-title">经典书架</div>
    <div class="scroll-area">
        <span class="interactive-tag ink-trigger" onclick="askAboutWork('狂人日记')">《狂人日记》</span>
        <span class="interactive-tag ink-trigger" onclick="askAboutWork('阿Q正传')">《阿Q正传》</span>
        <span class="interactive-tag ink-trigger" onclick="askAboutWork('故乡')">《故乡》</span>
    </div>
    <div class="section-title">先生寄语</div>
    <div class="scroll-area" id="quotesContainer"></div>
</div>

<div class="main-content">
    <div class="book-container">
        <div class="book-header desktop-only">
            <img class="portrait" src="luxun.jpg" alt="鲁迅">
            <div class="title-area">
                <h1>跨越时空的对话</h1>
                <p>「愿中国青年都摆脱冷气，只是向上走」</p>
            </div>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message luxun" id="first-msg"></div>
        </div>
        <div class="input-area">
            <textarea id="userInput" placeholder="写下想对先生说的话..."></textarea>
            <button id="sendBtn" class="ink-trigger">呈递</button>
        </div>
    </div>
</div>

<div class="tools-panel">
    <div class="section-title">先生书斋</div>
    <div class="tool-grid">
        <button class="tool-btn ink-trigger" onclick="useTool('essay')">✍️ 评判时事<br><small>代写犀利杂文</small></button>
        <button class="tool-btn ink-trigger" onclick="useTool('lyrics')">🎵 唤醒青年<br><small>创作现代歌词</small></button>
        <button class="tool-btn ink-trigger" onclick="useTool('story')">🏮 往事如烟<br><small>倾听生平轶事</small></button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
